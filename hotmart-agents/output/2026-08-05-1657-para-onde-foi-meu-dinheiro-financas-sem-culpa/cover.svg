  <text x="500" y="1120" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#a3a9b7">e sem planilha complicada</text>

  <text x="500" y="1400" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" letter-spacing="4" fill="#6b7180">EBOOK</text>
